<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 360px;
            padding: 40px 30px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card h1 {
            font-size: 24px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 30px;
            color: #111111;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: #555555;
            background-color: #ffffff;
            border: 1px solid #b0b0b0;
            box-sizing: border-box;
            outline: none;
        }

        .input-field::placeholder {
            color: #777777;
        }

        .input-field:focus {
            border-color: #666666;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #000000;
            background-color: #dcdcdc;
            border: 1px solid #b0b0b0;
            cursor: pointer;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .login-btn:hover {
            background-color: #cecece;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #333333;
            text-align: center;
        }

        .footer-text a {
            color: #333333;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
                height: auto;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .login-card {
                width: 100%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Login</h1>
        
        <form onsubmit="handleLogin(event)">
            <input type="text" class="input-field" placeholder="Email" required>
            <input type="password" class="input-field" placeholder="Password" required>
            
            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="Registration.html">Sign Up</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKamRkgkNd5PWBjqLuwsrmMGbZIByC21o",
            authDomain: "cinemech-55e04.firebaseapp.com",
            projectId: "cinemech-55e04",
            storageBucket: "cinemech-55e04.firebasestorage.app",
            messagingSenderId: "777654018729",
            appId: "1:777654018729:web:afd4d55e2a9344815abfb8"
        };

        const auth = getAuth(initializeApp(firebaseConfig));

        window.handleLogin = async function (event) {
            event.preventDefault();

            const fields = event.target.querySelectorAll(".input-field");
            const email = fields[0].value.trim();
            const password = fields[1].value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "Feedback.html";
            } catch (error) {
                alert(error.message);
            }
        };
    </script>
</body>
</html>
